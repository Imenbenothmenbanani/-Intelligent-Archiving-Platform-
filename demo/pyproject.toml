[tool.poetry]
name = "app"
version = "1.0.0"
description = "IAP — Intelligent Archiving Platform API & UI"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = {extras = ["standard"], version = ">=0.34.0,<1.0.0"}
python-multipart = ">=0.0.20,<1.0.0"
pydantic = ">=2.0.0,<3.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
boto3 = ">=1.42.74,<2.0.0"
transformers = ">=5.2.0,<6.0.0"
torch = {version = ">=2.5.0,<3.0.0", source = "pytorch-cuda"}
torchvision = {version = ">=0.20.0,<1.0.0", source = "pytorch-cuda"}
torchaudio = {version = ">=2.5.0,<3.0.0", source = "pytorch-cuda"}
numpy = ">=1.26.0,<3.0.0"
requests = ">=2.32.0,<3.0.0"
scikit-learn = ">=1.3.0,<2.0.0"
umap-learn = "^0.5.11"

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu121"
priority = "supplemental"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"